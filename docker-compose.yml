services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POI_PATH: data/poi.json
      DATA_KIND: real
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
