<!doctype html>
<html lang="ru">

  <title>Серуен — прогулки по Астане</title>
  <meta name="description" content="ИИ-помощник по прогулкам в Астане: 1–3 места рядом с честным «почему», временем и планом.">
  <meta name="theme-color" content="#00708A">
  <script src="theme.js"></script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></symbol>

    <symbol id="i-radius" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".9"/></symbol>

  <header class="top">
    <a class="brand" href="./" aria-label="Серуен">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#00AFCA"/><path d="M8.5 22.5c6 0 5.5-13 15-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><circle cx="8.5" cy="22.5" r="3.4" fill="#FFC20E" stroke="#fff" stroke-width="1.8"/><circle cx="23.5" cy="9.5" r="3" fill="#fff"/></svg>
      <div>
        <h1>Серуен</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </a>
    <nav class="top-actions">
      <button id="themeBtn" class="btn ghost" type="button"></button>
      <div class="dropdown">
        <button id="scenariosBtn" class="btn ghost" aria-haspopup="true" aria-expanded="false"><span data-i18n="scenarios"></span> ▾</button>
        <div id="scenariosMenu" class="menu" role="menu" hidden></div>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="kk">KZ</button><button data-lang="ru">RU</button><button data-lang="en">EN</button>
      </div>
      <span id="modeBadge" class="badge" hidden></span>
      <button id="mineBtn" class="btn ghost" type="button" aria-expanded="false" aria-controls="mine"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg> <span data-i18n="mine"></span></button>
      <a class="btn ghost" href="about.html" data-i18n="about"></a>
    </nav>
  </header>

  <main class="layout">
    <section class="map-wrap" aria-label="Map">
      <div id="map" tabindex="0"></div>
      <div class="map-tools">
        <label for="mapMode" data-i18n="mapView"></label>
        <select id="mapMode">
          <option value="streets" data-i18n="mapStreets"></option>
          <option value="satellite" data-i18n="mapSatellite"></option>
          <option value="hybrid" data-i18n="mapHybrid"></option>
        </select>
        <p id="mapNotice" class="meta" role="status" hidden></p>
        <button id="mapDetailBtn" type="button" class="btn small" data-i18n="mapDetails" hidden></button>
        <div id="storyLayerField" hidden></div>
      </div>
    </section>

    <section class="panel">
      <section id="welcome" class="welcome" aria-labelledby="welcomeTitle">
        <img src="img/hero-baiterek-night.jpg" alt="" class="welcome-img welcome-night" width="1280" height="960">
        <img src="img/hero-baiterek-day.jpg" alt="" class="welcome-img welcome-day" width="960" height="1440">
        <div class="welcome-text">
          <h2 id="welcomeTitle" data-i18n="heroTitle"></h2>
          <p data-i18n="heroText"></p>
        </div>
      </section>

      <form id="askForm" class="card block" autocomplete="off">
        <h2 data-i18n="what"></h2>
        <div id="searchModeField" hidden></div>
        <p id="locLine" class="loc-line" aria-live="polite"></p>
        <p id="geoMsg" class="msg warn" role="status" hidden></p>
        <div id="geoActions" class="geo-actions" hidden>
          <button id="geoRetry" type="button" class="btn small" data-i18n="retry"></button>
          <button id="geoMap" type="button" class="btn small" data-i18n="geoPickMap"></button>
        </div>
        <div id="meetingFields" hidden></div>
        <div id="chips" class="chips"></div>
        <div class="ask">
          <textarea id="query" rows="1" maxlength="500" data-i18n-placeholder="placeholder" aria-label="Query" aria-describedby="privacyHint"></textarea>
          <button id="goBtn" class="btn primary" type="submit" data-i18n="go"></button>
        </div>
        <p id="privacyHint" class="meta" data-i18n="privacyHint"></p>
        <div id="winterField" hidden></div>
        <details id="ctxBox" class="ctx">
          <summary data-i18n="settings"></summary>
          <div class="ctx-grid">
            <label><span data-i18n="budget"></span>
              <span class="row"><input id="budget" type="range" min="15" max="180" step="5" value="60">
              <output id="budgetOut">60</output>&nbsp;<span data-i18n="minutes"></span></span>
              <span class="row small"><input id="budgetAuto" type="checkbox" checked> <span data-i18n="budgetAuto"></span></span>
            </label>
            <label><span data-i18n="with"></span>
              <select id="companions">
                <option value="alone" data-i18n="alone"></option>
                <option value="child" data-i18n="child"></option>
                <option value="group" data-i18n="group"></option>
              </select>
            </label>
            <label><span data-i18n="when"></span>
              <span class="row"><select id="whenSel"><option value="now" data-i18n="now"></option><option value="other" data-i18n="other"></option></select>
              <input id="whenAt" type="datetime-local" hidden></span>
            </label>
            <label id="weatherField"><span data-i18n="weather"></span>
              <select id="weather">
                <option value="auto" data-i18n="wAuto"></option>
                <option value="off" data-i18n="wOff"></option>
                <option value="cold" data-i18n="wCold"></option>
                <option value="mild" data-i18n="wMild"></option>
              </select>
            </label>
            <label class="check"><input id="access" type="checkbox"> <span data-i18n="access"></span></label>
          </div>
        </details>
      </form>

      <section id="mine" class="card block mine" hidden aria-labelledby="mineTitle"></section>
      <section id="experiences" class="card block experiences" hidden></section>
      <section id="routeSetup" class="card block route-setup" hidden aria-labelledby="routeSetupTitle"></section>
      <section id="walk" class="card block walk-panel" hidden aria-live="polite"></section>

      <!-- kept empty for older code paths: the scenarios live in the header menu, with their photos -->
      <section id="scenarioStrip" class="strip" aria-labelledby="stripTitle" hidden>
        <h2 id="stripTitle" data-i18n="scenariosTitle"></h2>
        <div id="scenarioCards" class="strip-cards"></div>
      </section>

      <div id="status" class="status" aria-live="polite"></div>
      <div id="results"></div>
      <p class="foot"><span data-i18n="disclaimerShort"></span> <span id="snapshot"></span> · <a href="about.html" data-i18n="about"></a> · <a href="about.html#photos" data-i18n="photoCredit"></a></p>
    </section>
  </main>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="storage.js"></script>
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="route.js"></script>
  <script src="app.js"></script>
  <script src="features.js"></script>
  <script src="experiences-i18n.js"></script>
  <script src="experiences.js"></script>
</body>
</html>
